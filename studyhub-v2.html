<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyHub Malawi</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f4;--card:#fff;--tx:#1b2a22;--mu:#66756c;--ac:#1f7a4d;--ac2:#e3f2ea;--bd:#dfe5e0;--wa:#b4570a;--wb:#fdebd6}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121a15;--card:#1b251f;--tx:#e8f0ea;--mu:#9bab9f;--ac:#4cc58a;--ac2:#1f3a2c;--bd:#2b3a31;--wa:#e8a05a;--wb:#3a2a18}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:16px;background:var(--ac);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;opacity:.85;font-size:13px}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit}
main{max-width:640px;margin:0 auto;padding:12px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input,select,button.go{width:100%;padding:10px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button.go{background:var(--ac);color:#fff;border:0;font-weight:600}
.row{display:flex;gap:8px}.row>*{flex:1}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);margin-right:4px}
.pend{background:var(--wb);color:var(--wa)}
.mu{color:var(--mu);font-size:13px}
.sm{padding:6px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:8px 6px 0 0}
.lnk{background:none;border:0;color:var(--ac);font:inherit;font-weight:600;padding:6px 0}
</style>
</head>
<body>
<header><div><h1>StudyHub Malawi</h1><p>Slides, past papers and quizzes</p></div><div id="top"></div></header>
<main id="app"><p class="mu">Loading...</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
// STEP 1: paste your two values from Supabase > Project Settings > API
var SUPABASE_URL="https://hxrllrdzzuwaltvlqivd.supabase.co";
var SUPABASE_KEY="sb_publishable_DrBcUu7X6ix8J5Rsx9nalQ_CwOOLXNV";

var PAY_INFO="To get a weekly token, pay MK XXXX to Airtel Money 099X XXX XXX and send the receipt to the admin. Access starts within minutes.";
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var UNIS=["LUANAR (Bunda)","LUANAR (NRC)","LUANAR (Sire)","UNIMA","MUBAS","MUST","Other"];
var TYPES=["Slides","Past paper","Quiz","Notes"];
var S={tab:"browse",mode:"in",user:null,role:"student",items:[],q:"",uni:"",type:"",msg:"",until:null};
var $=function(id){return document.getElementById(id)};
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function opts(a,sel){return a.map(function(u){return "<option"+(sel===u?" selected":"")+">"+esc(u)+"</option>"}).join("")}

async function setUser(u){
  S.user=u;S.role="student";S.until=null;S.items=[];
  if(u){
    var r=await sb.from("profiles").select("role,access_until").eq("id",u.id).maybeSingle();
    if(r.data){S.role=r.data.role;S.until=r.data.access_until}
    await load();
  }
  render();
}
async function load(){
  var r=await sb.from("materials").select("*").order("created_at",{ascending:false});
  S.items=r.data||[];
}

function card(m,admin){
  var btn=m.file_path?'<button class="sm" data-a="dl" data-p="'+esc(m.file_path)+'">Download</button>':"";
  if(admin){
    if(!m.approved)btn+='<button class="sm" data-a="ok" data-id="'+esc(m.id)+'">Approve</button>';
    btn+='<button class="sm" data-a="del" data-id="'+esc(m.id)+'" data-p="'+esc(m.file_path||"")+'">Delete</button>';
  }
  return '<div class="card"><b>'+esc(m.title)+'</b><div style="margin:6px 0"><span class="tag">'+esc(m.type)+'</span><span class="tag">'+esc(m.course)+'</span><span class="tag">Year '+esc(m.year)+'</span>'+(m.approved?"":'<span class="tag pend">Pending</span>')+'</div><div class="mu">'+esc(m.uni)+'</div>'+btn+'</div>';
}

function authView(){
  var up=S.mode==="up";
  return '<div class="card"><b>'+(up?"Create account":"Sign in")+'</b>'+
  (up?'<input id="nm" placeholder="Full name" autocomplete="name"><input id="ph" type="tel" placeholder="Phone number (e.g. 0991234567)" autocomplete="tel">':"")+
  '<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="'+(up?"new-password":"current-password")+'">'+
  '<button class="go" data-a="auth">'+(up?"Sign up":"Sign in")+'</button><p class="mu" id="am">'+esc(S.msg)+'</p>'+
  '<button class="lnk" data-a="mode">'+(up?"I already have an account":"New here? Create an account")+'</button></div>';
}

function browseView(){
  var q=S.q.toLowerCase();
  var l=S.items.filter(function(m){return m.approved&&(!S.uni||m.uni===S.uni)&&(!S.type||m.type===S.type)&&(!q||(m.title+" "+m.course).toLowerCase().indexOf(q)>-1)});
  return accessBar()+'<div class="card"><input id="q" placeholder="Search course code or title" value="'+esc(S.q)+'"><div class="row"><select id="fu"><option value="">All universities</option>'+opts(UNIS,S.uni)+'</select><select id="ft"><option value="">All types</option>'+opts(TYPES,S.type)+'</select></div></div>'+
  (l.length?l.map(function(m){return card(m,false)}).join(""):'<p class="mu">Nothing here yet.</p>');
}

function uploadView(){
  return '<div class="card"><b>Upload material</b><p class="mu">Your file appears for everyone after admin approval.</p>'+
  '<input id="ut" placeholder="Title (e.g. Microscopy slides)"><input id="uc" placeholder="Course code (e.g. BIO31101)">'+
  '<div class="row"><select id="uu">'+opts(UNIS)+'</select><select id="uy"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>'+
  '<select id="uk">'+opts(TYPES)+'</select><input id="uf" type="file" accept=".pdf,.ppt,.pptx,.doc,.docx,image/*">'+
  '<button class="go" data-a="send">Submit</button><p class="mu" id="um">'+esc(S.msg)+'</p></div>';
}

function adminView(){
  var p=S.items.filter(function(m){return !m.approved}),a=S.items.filter(function(m){return m.approved});
  return grantCard()+'<p class="mu">'+p.length+' pending, '+a.length+' live</p><p class="mu">'+esc(S.msg)+'</p>'+p.concat(a).map(function(m){return card(m,true)}).join("");
}

function render(){
  $("top").innerHTML=S.user?'<button data-a="out">Sign out</button>':"";
  var app=$("app");
  if(!S.user){app.innerHTML=authView();return}
  var tabs=[["browse","Browse"],["upload","Upload"]];
  if(S.role==="admin")tabs.push(["admin","Admin"]);
  app.innerHTML='<nav>'+tabs.map(function(t){return '<button data-a="tab" data-t="'+t[0]+'" class="'+(S.tab===t[0]?"on":"")+'">'+t[1]+'</button>'}).join("")+'</nav>'+
    (S.tab==="upload"?uploadView():S.tab==="admin"&&S.role==="admin"?adminView():browseView());
  if($("q")){
    $("q").oninput=function(e){S.q=e.target.value;var p=e.target.selectionStart;render();var n=$("q");n.focus();n.setSelectionRange(p,p)};
    $("fu").onchange=function(e){S.uni=e.target.value;render()};
    $("ft").onchange=function(e){S.type=e.target.value;render()};
  }
}

function hasAccess(){return S.role==="admin"||!!(S.until&&new Date(S.until)>new Date())}
function accessBar(){
  if(S.role==="admin")return "";
  if(hasAccess())return '<div class="card"><span class="tag">Active</span> Access until '+esc(new Date(S.until).toLocaleDateString())+'</div>';
  return '<div class="card"><span class="tag pend">No access</span><p style="margin:6px 0 0">'+esc(PAY_INFO)+'</p></div>';
}
function grantCard(){return '<div class="card"><b>Give access</b><p class="mu">Enter the student email or phone number and how many weekly tokens they paid for.</p><input id="gi" placeholder="Email or phone (0991234567)"><select id="gw"><option value="1">1 week</option><option value="2">2 weeks</option><option value="3">3 weeks</option><option value="4">4 weeks</option></select><button class="go" data-a="grant">Add access</button><p class="mu" id="gm"></p></div>'}
async function doGrant(){
  var raw=$("gi").value.trim(),w=parseInt($("gw").value,10);
  if(!raw){say("gm","Enter an email or phone number.");return}
  var id=raw.indexOf("@")>-1?raw:(mw(raw)||raw);
  say("gm","Working...");
  var r=await sb.rpc("grant_access",{p_id:id,p_weeks:w});
  if(r.error){say("gm",r.error.message);return}
  say("gm","Done. Access now runs until "+new Date(r.data).toLocaleDateString()+".");
}
function mw(p){p=(p||"").replace(/[\s\-()]/g,"");if(/^0\d{9}$/.test(p))return "+265"+p.slice(1);if(/^\+265\d{9}$/.test(p))return p;if(/^265\d{9}$/.test(p))return "+"+p;return ""}
function say(id,t){var e=$(id);if(e)e.textContent=t}

async function doAuth(){
  var em=$("em").value.trim(),pw=$("pw").value,up=S.mode==="up";
  if(!em||pw.length<6){say("am","Enter your email and a password of 6+ characters.");return}
  var ph=up?mw($("ph").value):"";if(up&&!ph){say("am","Enter a valid Malawi phone number, e.g. 0991234567.");return}say("am","Please wait...");
  var r=up?await sb.auth.signUp({email:em,password:pw,options:{data:{name:($("nm").value||"").trim(),phone:ph}}}):await sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error){say("am",r.error.message);return}
  if(up&&!r.data.session){say("am","Account created. Check your email to confirm, then sign in.");return}
  await setUser(r.data.session.user);
}

async function doSend(){
  var f=$("uf").files[0],t=$("ut").value.trim(),c=$("uc").value.trim();
  if(!t||!c||!f){say("um","Add a title, course code and a file.");return}
  if(f.size>20*1024*1024){say("um","File is too big (max 20 MB).");return}
  say("um","Uploading...");
  var path=S.user.id+"/"+Date.now()+"-"+f.name.replace(/[^\w.\-]+/g,"_");
  var u=await sb.storage.from("materials").upload(path,f);
  if(u.error){say("um",u.error.message);return}
  var r=await sb.from("materials").insert({title:t,course:c.toUpperCase().replace(/\s+/g,""),uni:$("uu").value,year:$("uy").value,type:$("uk").value,file_path:path,uploader:S.user.id,approved:false});
  if(r.error){say("um",r.error.message);return}
  await load();S.msg="Submitted. It will show after admin approval.";render();S.msg="";
}

document.addEventListener("click",async function(e){
  var b=e.target.closest&&e.target.closest("[data-a]");if(!b)return;
  var a=b.getAttribute("data-a"),id=b.getAttribute("data-id"),p=b.getAttribute("data-p");
  if(a==="tab"){S.tab=b.getAttribute("data-t");S.msg="";render()}
  else if(a==="mode"){S.mode=S.mode==="in"?"up":"in";S.msg="";render()}
  else if(a==="auth")doAuth();
  else if(a==="send")doSend();
  else if(a==="grant")doGrant();
  else if(a==="out"){await sb.auth.signOut();setUser(null)}
  else if(a==="dl"){
    if(!hasAccess()){alert("You need an active weekly token to download. See the box on the Browse tab for how to get one.");return}
    var r=await sb.storage.from("materials").createSignedUrl(p,3600);
    if(r.error)alert(r.error.message);else window.open(r.data.signedUrl,"_blank");
  }else if(a==="ok"||a==="del"){
    S.msg="Working...";render();
    var res;
    if(a==="ok")res=await sb.from("materials").update({approved:true}).eq("id",id);
    else{if(p)await sb.storage.from("materials").remove([p]);res=await sb.from("materials").delete().eq("id",id)}
    S.msg=res.error?res.error.message:"Done.";
    await load();render();
  }
});

(async function(){
  var r=await sb.auth.getSession();
  await setUser(r.data.session?r.data.session.user:null);
})();
</script>
</body>
</html>
